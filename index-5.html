<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกทำข้อสอบครูผู้ช่วย</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f0;--c:#fff;--t:#1b1a2e;--m:#78758f;--p:#4f46e5;--a:#ff6b4a;--ok:#0f9d6b;--no:#e0364f;--b:#ece7de;--sh:0 1px 2px rgba(30,20,60,.06),0 10px 28px rgba(30,20,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111d;--c:#1c1a2e;--t:#f1f0fb;--m:#9d9bbb;--p:#8b84ff;--a:#ff8466;--ok:#4cd9a0;--no:#ff8a9c;--b:#2d2b47;--sh:0 10px 28px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#12111d;--c:#1c1a2e;--t:#f1f0fb;--m:#9d9bbb;--p:#8b84ff;--a:#ff8466;--ok:#4cd9a0;--no:#ff8a9c;--b:#2d2b47;--sh:0 10px 28px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.65 Sarabun,system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:14px 16px 110px}
button{font:inherit;color:var(--t);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid var(--p);outline-offset:2px}button:disabled{opacity:.35}
.m{color:var(--m);font-size:.86rem}h2{font-size:1rem;margin:24px 2px 8px;letter-spacing:.02em}
.hero{border-radius:26px;padding:22px;color:#fff;background:radial-gradient(circle at 85% 10%,#ff6b4a 0,transparent 45%),radial-gradient(circle at 10% 100%,#7c3aed 0,transparent 55%),#312e81;box-shadow:var(--sh);display:flex;gap:16px;align-items:center}
.hero h1{margin:0;font-size:1.45rem;line-height:1.3}.hero p{margin:.3rem 0 0;font-size:.9rem;opacity:.9}
.rg{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center}.rg div{width:66px;height:66px;border-radius:50%;background:#312e81;display:grid;place-items:center;font-weight:700;font-size:1.1rem;line-height:1}.rg small{font-size:.6rem;font-weight:400;opacity:.8;display:block;text-align:center}
.seg{display:flex;background:var(--b);border-radius:16px;padding:4px;margin:14px 0 0}.seg button{flex:1;border:0;background:none;border-radius:12px;padding:9px 6px;font-size:.9rem}.seg .on{background:var(--c);box-shadow:var(--sh);font-weight:700}
.q3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.go{border:0;border-radius:18px;background:var(--c);box-shadow:var(--sh);padding:14px 8px;text-align:center}.go b{display:block;font-size:1.3rem;color:var(--a)}.go span{font-size:.8rem;color:var(--m)}
.long{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;background:var(--c);box-shadow:var(--sh);padding:13px 14px;margin-top:10px;text-align:left}
.sub{display:flex;gap:14px;align-items:center;width:100%;border:0;border-radius:20px;background:var(--c);box-shadow:var(--sh);padding:14px;margin:10px 0;text-align:left}
.ic{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem}
.sub b{display:block;line-height:1.35}.bt{height:6px;border-radius:3px;background:var(--b);margin-top:8px;overflow:hidden}.bt i{display:block;height:100%;border-radius:3px}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.ib{flex:none;border:0;background:var(--c);box-shadow:var(--sh);border-radius:12px;min-width:40px;height:40px;padding:0 10px}
.bar{flex:1;height:8px;background:var(--b);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--a));transition:width .3s}
.card{background:var(--c);border-radius:22px;padding:18px;margin:10px 0;box-shadow:var(--sh)}
.tag{display:inline-block;border-radius:99px;padding:2px 12px;font-size:.78rem;font-weight:700;color:#fff}
.qn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.q{font-weight:700;font-size:1.08rem;line-height:1.6}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:10px 0;border:2px solid var(--b);background:var(--c);border-radius:18px;padding:12px 14px}
.l{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--b);font-weight:700;font-size:.9rem}
.opt.on{border-color:var(--p)}.opt.on .l{background:var(--p);color:#fff}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--c))}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--c))}.opt.bad .l{background:var(--no);color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--b);z-index:6}
.dock div{max-width:640px;margin:auto;display:flex;gap:10px}.dock button{flex:1;border:2px solid var(--b);background:var(--c);border-radius:16px;padding:13px}
.pri{background:linear-gradient(135deg,var(--p),var(--a))!important;color:#fff!important;border:0!important;font-weight:700}
.btn{display:block;width:100%;border:2px solid var(--b);background:var(--c);border-radius:16px;padding:13px;margin:10px 0}
.pal{position:fixed;inset:0;background:rgba(10,8,25,.55);z-index:20;display:flex;align-items:flex-end}.pal>div{background:var(--bg);width:100%;max-width:640px;margin:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:70%;overflow:auto}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}.g button{border:2px solid var(--b);background:var(--c);border-radius:12px;padding:8px 0}.g .d{background:var(--p);color:#fff;border-color:var(--p)}.g .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.g .bad{background:var(--no);color:#fff;border-color:var(--no)}.g .cur{outline:3px solid var(--a)}
.res{text-align:center}.res .rg{width:150px;height:150px;margin:6px auto}.res .rg div{width:118px;height:118px;background:var(--c);color:var(--t);font-size:2.1rem}.res .rg small{font-size:.8rem;color:var(--m)}
.st{display:flex;gap:8px;margin-top:12px}.st div{flex:1;background:var(--bg);border-radius:14px;padding:8px}.st b{display:block;font-size:1.15rem}
.tabs{display:flex;gap:8px;margin:16px 0 4px}.tabs button{flex:1;border:2px solid var(--b);background:var(--c);border-radius:99px;padding:7px 4px;font-size:.85rem}.tabs .on{border-color:var(--p);color:var(--p);font-weight:700}
.ok{color:var(--ok)}.no{color:var(--no)}.rv{padding:6px 10px;border-radius:10px;margin:4px 0;font-size:.95rem}.rv.a{background:color-mix(in srgb,var(--ok) 18%,var(--c));font-weight:700}.rv.w{background:color-mix(in srgb,var(--no) 18%,var(--c))}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cn{width:100%;display:flex;gap:8px}.dock .cn button{padding:8px 0;border-radius:12px;font-size:.92rem}.dock .cn button.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,var(--c));font-weight:700}.cn input{flex:1.4;min-width:0;border:2px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);font:inherit;padding:6px 8px;text-align:center}.cn input:focus{outline:3px solid var(--p);outline-offset:1px}.gh{display:flex;align-items:center;justify-content:space-between}.gh .ib{height:32px;font-size:.8rem}
</style></head><body><main id="app"></main>
<script src="exam-data.js"></script>
<script>
if(!window.BASE){document.getElementById('app').innerHTML='<div style="padding:24px;font:16px sans-serif">ไม่พบไฟล์ <b>exam-data.js</b> — วางไว้โฟลเดอร์เดียวกับ index.html</div>';throw new Error('exam-data.js missing')}
const S=[...BASE.S],Q=[...BASE.Q];
const IC=[...BASE.IC],CL=[...BASE.CL],L=['ก','ข','ค','ง','จ'];
// ต่อชุดเพิ่มเติม (EXTRA) จาก exam-data.js ต่อท้าย S/Q เพื่อให้ความคืบหน้าเดิมไม่เพี้ยน
try{(window.EXTRA||[]).forEach(b=>{const k=S.length;S.push(b.name);IC.push(b.icon||'📝');CL.push(b.color||'#6c5ce7');b.q.forEach(q=>Q.push([k,q[0],q[1],q[2]]))})}catch(e){}
const A=document.getElementById('app'),sh=a=>[...a].sort(()=>Math.random()-.5);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let M=new Set(ld('ktm',[])),BK=new Set(ld('ktbk',[])),mode=ld('ktmode','now'),qs=[],an=[],i=0,t0=0,tm=0,flt=0,pal=0,tt=0;
const ids=f=>Q.map((q,k)=>k).filter(f),mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const stop=()=>clearInterval(tm);
const G=6,H=17;
function row(k){const s=S[k].replace(/^ภาษาไทย · /,'');const a=ids(j=>Q[j][0]==k),d=a.filter(j=>M.has(j)).length;return `<button class="sub fade" onclick="go(ids(j=>Q[j][0]==${k}))"><span class="ic" style="background:${CL[k]}22">${IC[k]}</span><span style="flex:1"><b>${s}</b><span class="m">ถูกแล้ว ${d}/${a.length} ข้อ</span><div class="bt"><i style="width:${d/a.length*100}%;background:${CL[k]}"></i></div></span></button>`}
function home(){stop();const pc=Math.round(M.size/Q.length*100),wr=ids(k=>!M.has(k)).length;
A.innerHTML=`<div class="hero fade"><div style="flex:1"><h1>ฝึกทำข้อสอบ<br>ครูผู้ช่วย</h1><p>ภาค ก. · ${Q.length} ข้อ · ทำถูกแล้ว ${M.size} ข้อ</p></div><div class="rg" style="background:conic-gradient(#fff ${pc*3.6}deg,rgba(255,255,255,.25) 0)"><div><span>${pc}%<small>เก่งแล้ว</small></span></div></div></div>
<div class="seg"><button class="${mode=='now'?'on':''}" onclick="mode='now';sv('ktmode',mode);home()">⚡ เฉลยทันที</button><button class="${mode=='end'?'on':''}" onclick="mode='end';sv('ktmode',mode);home()">📝 เฉลยท้ายชุด</button></div>
<div class="q3"><button class="go" onclick="go(ids(()=>1),20)"><b>20</b><span>สุ่มเร็ว</span></button><button class="go" onclick="go(ids(()=>1),40)"><b>40</b><span>สุ่มกลาง</span></button><button class="go" onclick="go(ids(()=>1),60)"><b>60</b><span>สุ่มเต็ม</span></button></div>
<button class="long" onclick="cust()"><span class="ic" style="background:#4f46e522">🎯</span><span><b>สุ่มเลือกวิชาเอง</b><br><span class="m">เลือกกี่ชุดก็ได้ · กำหนดจำนวนข้อเอง</span></span></button>
<button class="long" onclick="go(ids(k=>!M.has(k)),30)" ${wr?'':'disabled'}><span class="ic" style="background:#ff6b4a22">🎲</span><span><b>เจาะข้อที่ยังไม่เคยถูก</b><br><span class="m">เหลือ ${wr} ข้อ</span></span></button>
<button class="long" onclick="go([...BK])" ${BK.size?'':'disabled'}><span class="ic" style="background:#d99a0022">⭐</span><span><b>ทบทวนข้อที่บันทึกไว้</b><br><span class="m">${BK.size} ข้อ</span></span></button>
<h2>เลือกทีละฉบับ</h2>`+S.map((s,k)=>k<G?row(k):'').join('')+`<h2>📚 วิชาภาษาไทย <span class="m">· ${H-G} หัวข้อ</span></h2><div class="q3" style="grid-template-columns:repeat(2,1fr)"><button class="go" onclick="go(ids(j=>Q[j][0]>=G),30)"><b>30</b><span>สุ่มภาษาไทย</span></button><button class="go" onclick="go(ids(j=>Q[j][0]>=G),60)"><b>60</b><span>สุ่มภาษาไทย</span></button></div><div class="m" style="margin:8px 2px 4px">ภาษาไทยทั้งหมด ${ids(j=>Q[j][0]>=G).length} ข้อ · ถูกแล้ว ${ids(j=>Q[j][0]>=G&&M.has(j)).length} ข้อ</div>`+S.map((s,k)=>k>=G&&k<H?row(k):'').join('')+`<h2>📝 ชุดข้อสอบวิชาภาษาไทย <span class="m">· ${S.length-H} ชุด</span></h2><div class="q3" style="grid-template-columns:repeat(2,1fr)"><button class="go" onclick="go(ids(j=>Q[j][0]>=H),30)"><b>30</b><span>สุ่มจากทุกชุด</span></button><button class="go" onclick="go(ids(j=>Q[j][0]>=H),60)"><b>60</b><span>สุ่มจากทุกชุด</span></button></div><div class="m" style="margin:8px 2px 4px">${ids(j=>Q[j][0]>=H).length} ข้อ · ถูกแล้ว ${ids(j=>Q[j][0]>=H&&M.has(j)).length} ข้อ</div>`+S.map((s,k)=>k>=H?row(k):'').join('')}
let cs=new Set(ld('ktcs',[]).filter(k=>k<S.length)),cn=ld('ktcn',40);
const CNT=S.map((s,k)=>Q.filter(q=>q[0]==k).length),GR=[['📘 ก.พ. / กฎหมาย / จริยธรรม',0,G],['📚 ภาษาไทย แยกหัวข้อ',G,H],['📝 ชุดข้อสอบวิชาภาษาไทย',H,S.length]];
function cust(){stop();
A.innerHTML=`<div class="top"><button class="ib" onclick="home()">← กลับ</button><b style="flex:1">🎯 สุ่มเลือกวิชาเอง</b></div><div class="m" style="margin:4px 2px 0">เลือกกี่ชุดก็ได้ แล้วกำหนดจำนวนข้อที่จะสุ่ม</div>`+GR.map(([t,a,b])=>`<div class="gh"><h2>${t}</h2><button class="ib" onclick="tgg(${a},${b})">เลือก/ล้างทั้งกลุ่ม</button></div>`+S.map((s,k)=>k>=a&&k<b?`<button class="opt${cs.has(k)?' on':''}" id="cs${k}" onclick="tg(${k})"><span class="l">${cs.has(k)?'✓':''}</span><span>${s.replace(/^ภาษาไทย · /,'')}<br><span class="m">${CNT[k]} ข้อ</span></span></button>`:'').join('')).join('')+`<div style="height:80px"></div><div class="dock"><div style="flex-direction:column"><div class="cn">${[20,40,60,100].map(n=>`<button id="cc${n}" onclick="sc(${n})">${n}</button>`).join('')}<input id="cni" type="number" inputmode="numeric" min="1" max="999" value="${cn}" aria-label="จำนวนข้อ" oninput="sc(this.value,1)"></div><span class="m" id="cs-sum" style="text-align:center"></span><button class="pri" id="cs-go" onclick="st()"></button></div></div>`;sm();scrollTo(0,0)}
function pt(k){const e=document.getElementById('cs'+k);if(!e)return;e.classList.toggle('on',cs.has(k));e.firstChild.textContent=cs.has(k)?'✓':''}
function sm(){const X=[...cs].reduce((a,k)=>a+CNT[k],0),n=Math.min(cn,X),g=document.getElementById('cs-go');
document.getElementById('cs-sum').textContent=cs.size?`เลือก ${cs.size} ชุด · มีทั้งหมด ${X} ข้อ`+(cn>X?' (ไม่ถึงจำนวนที่ต้องการ จะสุ่มทั้งหมด)':''):'ยังไม่ได้เลือกชุดข้อสอบ';
g.textContent=`เริ่มสุ่ม ${n} ข้อ`;g.disabled=!(cs.size&&cn>0);
[20,40,60,100].forEach(v=>document.getElementById('cc'+v).classList.toggle('on',cn==v));sv('ktcs',[...cs]);sv('ktcn',cn)}
function tg(k){cs.has(k)?cs.delete(k):cs.add(k);pt(k);sm()}
function tgg(a,b){const r=[];for(let k=a;k<b;k++)r.push(k);const all=r.every(k=>cs.has(k));r.forEach(k=>{all?cs.delete(k):cs.add(k);pt(k)});sm()}
function sc(v,fi){cn=Math.max(0,Math.min(999,parseInt(v)||0));if(!fi)document.getElementById('cni').value=cn;sm()}
function st(){go(ids(j=>cs.has(Q[j][0])),cn)}
function go(a,n){if(!a.length)return;qs=sh(a).slice(0,n||999);an=[];i=0;pal=0;t0=Date.now();stop();tm=setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=mmss(Math.floor((Date.now()-t0)/1000))},1000);show()}
function show(){const id=qs[i],q=Q[id],a=an[i],lock=mode=='now'&&a!=null,last=i==qs.length-1;
A.innerHTML=`<div class="top"><button class="ib" aria-label="ออกจากข้อสอบ" onclick="quit()">✕ ออก</button><div class="bar"><i style="width:${(i+1)/qs.length*100}%"></i></div><span class="m" id="tm">${mmss(Math.floor((Date.now()-t0)/1000))}</span><button class="ib" aria-label="ดูทุกข้อ" onclick="pal=1;show()">▦</button></div>
<div class="fade"><div class="card"><div class="qn"><span class="tag" style="background:${CL[q[0]]}">${IC[q[0]]} ${S[q[0]]}</span><button class="ib" aria-label="บันทึกข้อนี้" onclick="bk(${id})">${BK.has(id)?'⭐':'☆'}</button></div><div class="m">ข้อ ${i+1} จาก ${qs.length}</div><div class="q">${q[1]}</div></div>`+q[2].map((c,k)=>{let cl=a===k?' on':'';if(lock)cl=k==q[3]?' ok':a===k?' bad':'';return `<button class="opt${cl}" ${lock?'disabled':''} onclick="pick(${k})"><span class="l">${L[k]}</span><span>${c}</span></button>`}).join('')+`</div><div class="dock"><div><button onclick="mv(-1)" ${i?'':'disabled'}>←</button>${last?`<button class="pri" onclick="end()">ส่งและดูผล ✓</button>`:`<button class="pri" onclick="mv(1)">ถัดไป →</button>`}</div></div>`+(pal?`<div class="pal" onclick="pal=0;show()"><div onclick="event.stopPropagation()"><b>ข้อทั้งหมด</b> <span class="m">แตะเพื่อกระโดดไปข้อนั้น</span><div class="nv"><button class="btn" onclick="pal=0;quit()">🔀 เลือกข้อสอบชุดใหม่</button></div><div class="g">${qs.map((x,k)=>{const r=an[k];let c=r==null?'':mode=='now'?(r===Q[x][3]?'ok':'bad'):'d';return `<button class="${c}${k==i?' cur':''}" onclick="i=${k};pal=0;show()">${k+1}</button>`}).join('')}</div></div></div>`:'')}
function quit(){const u=qs.length-an.filter(x=>x!=null).length;if(confirm(u?`ออกจากข้อสอบ? (ยังไม่ได้ตอบ ${u} ข้อ ผลที่ทำไปจะไม่ถูกบันทึก)`:'ออกจากข้อสอบ?'))home()}
function bk(id){BK.has(id)?BK.delete(id):BK.add(id);sv('ktbk',[...BK]);show()}
function pick(k){an[i]=k;if(mode=='now'&&k===Q[qs[i]][3]){M.add(qs[i]);sv('ktm',[...M])}show()}
function mv(d){i+=d;show();scrollTo(0,0)}
function end(){const u=qs.length-an.filter(x=>x!=null).length;if(u&&!confirm(`ยังไม่ได้ตอบ ${u} ข้อ ส่งเลยไหม`))return;stop();tt=Math.floor((Date.now()-t0)/1000);
qs.forEach((x,k)=>{if(an[k]===Q[x][3])M.add(x)});sv('ktm',[...M]);flt=0;rev()}
function rev(){const r=qs.filter((x,k)=>an[k]===Q[x][3]).length,n=qs.length,pc=Math.round(r/n*100),col=pc>=60?'var(--ok)':'var(--no)',msg=pc>=80?'เยี่ยมมาก! 🎉':pc>=60?'ผ่านเกณฑ์แล้ว 👍':'อีกนิดเดียว สู้ต่อ 💪';
A.innerHTML=`<div class="card res fade"><div class="rg" style="background:conic-gradient(${col} ${pc*3.6}deg,var(--b) 0)"><div><span>${pc}%<small>${r}/${n} ข้อ</small></span></div></div><b>${msg}</b><div class="st"><div><b class="ok">${r}</b><span class="m">ถูก</span></div><div><b class="no">${n-r}</b><span class="m">ผิด/ว่าง</span></div><div><b>${mmss(tt)}</b><span class="m">เวลา</span></div></div></div>
<button class="btn pri" onclick="go(qs.slice())">ทำชุดนี้ใหม่ 🔄</button><button class="btn" onclick="go(qs.filter((x,k)=>an[k]!==Q[x][3]))">ทำเฉพาะข้อที่ผิด</button><button class="btn" onclick="home()">🔀 เลือกข้อสอบชุดใหม่</button>
<div class="tabs">${['ทั้งหมด','เฉพาะข้อผิด','⭐ บันทึก'].map((t,k)=>`<button class="${flt==k?'on':''}" onclick="flt=${k};rev()">${t}</button>`).join('')}</div>`+qs.map((x,k)=>{const q=Q[x],ok=an[k]===q[3];if(flt==1&&ok||flt==2&&!BK.has(x))return'';return `<div class="card"><b>${k+1}. ${q[1]}</b> <span class="${ok?'ok':'no'}">${ok?'✓ ถูก':'✗ ผิด'}</span><div class="m" style="margin:2px 0 6px">${S[q[0]]}</div>`+q[2].map((c,j)=>`<div class="rv${j===q[3]?' a':''}${j===an[k]&&!ok?' w':''}">${L[j]}) ${c}${j===q[3]?' ✓':''}${j===an[k]&&!ok?' · ที่คุณเลือก':''}</div>`).join('')+`</div>`}).join('');scrollTo(0,0)}
home();
</script></body></html>
