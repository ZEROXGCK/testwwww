</style></head><body><main id="app"></main>

<script>
if(!window.BASE){document.getElementById('app').innerHTML='<div style="padding:24px;font:16px sans-serif">ไม่พบไฟล์ <b>exam-data.js</b> — วางไว้โฟลเดอร์เดียวกับ index.html</div>';if(window.Swal)Swal.fire({icon:'error',title:'โหลดข้อสอบไม่สำเร็จ',html:'ไม่พบไฟล์ <b>exam-data.js</b><br>วางไว้โฟลเดอร์เดียวกับ index.html แล้วรีเฟรชหน้า',confirmButtonText:'รีเฟรช'}).then(()=>location.reload());throw new Error('exam-data.js missing')}
const S=[...BASE.S],Q=[...BASE.Q];
const IC=[...BASE.IC],CL=[...BASE.CL],L=['ก','ข','ค','ง','จ'];
// ต่อชุดเพิ่มเติม (EXTRA) จาก exam-data.js ต่อท้าย S/Q เพื่อให้ความคืบหน้าเดิมไม่เพี้ยน
try{(window.EXTRA||[]).forEach(b=>{let k;if(b.to!=null){k=b.to;if(!(k>=0&&k<S.length))return}else{k=S.length;S.push(b.name);IC.push(b.icon||'📝');CL.push(b.color||'#6c5ce7')}b.q.forEach(q=>Q.push([k,q[0],q[1],q[2]]))})}catch(e){}
const S0=[...S],MT=Object.assign({names:{},order:[]},window.META||{});
Object.keys(MT.names||{}).forEach(k=>{if(S[k]!=null&&String(MT.names[k]).trim())S[k]=MT.names[k]});
const OS=()=>{const o=(MT.order||[]).filter((k,i,a)=>k>=0&&k<S.length&&a.indexOf(k)==i);S.forEach((s,k)=>{if(!o.includes(k))o.push(k)});return o};
const A=document.getElementById('app'),sh=a=>[...a].sort(()=>Math.random()-.5);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let M=new Set(ld('ktm',[])),BK=new Set(ld('ktbk',[])),mode=ld('ktmode','now'),qs=[],an=[],i=0,t0=0,tm=0,flt=0,pal=0,tt=0;
const ids=f=>Q.map((q,k)=>k).filter(f),mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

const cf=(title,text,ok,icon)=>window.Swal?Swal.fire({title,text,icon:icon||'question',showCancelButton:true,confirmButtonText:ok||'ตกลง',cancelButtonText:'ยกเลิก',reverseButtons:true,focusCancel:true}).then(r=>r.isConfirmed):Promise.resolve(confirm(title+(text?'\n'+text:'')));
const al=(title,text,icon)=>window.Swal?Swal.fire({title,html:text,icon:icon||'info',confirmButtonText:'ตกลง'}):(alert(title+(text?'\n'+String(text).replace(/<[^>]+>/g,''):'')),Promise.resolve());
const toast=(t,icon)=>{if(window.Swal)Swal.fire({toast:true,position:'top',icon:icon||'success',title:t,showConfirmButton:false,timer:1400,timerProgressBar:true})};
const G=6,H=17;
function row(k){const s=S[k].replace(/^ภาษาไทย · /,'');const a=ids(j=>Q[j][0]==k),d=a.filter(j=>M.has(j)).length;return `<button class="sub fade" onclick="go(ids(j=>Q[j][0]==${k}))"><span class="ic" style="background:${CL[k]}22">${IC[k]}</span><span style="flex:1"><b>${s}</b><span class="m">ถูกแล้ว ${d}/${a.length} ข้อ</span><div class="bt"><i style="width:${d/a.length*100}%;background:${CL[k]}"></i></div></span></button>`}
function setMode(m){mode=m;sv('ktmode',mode);home();toast(m=='now'?'⚡ เฉลยทันทีหลังตอบแต่ละข้อ':'📝 เฉลยตอนท้ายชุด','info')}

// ===== เพิ่มข้อสอบ: วางรูปแบบ JS แล้วบันทึกลง exam-data.js =====
let FH=null;
function aqParse(txt){let r;
 try{r=new Function('"use strict";return ['+txt+'\n]')()}catch(e){throw new Error('อ่านรูปแบบไม่ได้: '+e.message)}
 if(r.length==1&&Array.isArray(r[0])&&Array.isArray(r[0][0])&&Array.isArray(r[0][0][1]))r=r[0];
 if(!r.length)throw new Error('ยังไม่ได้ใส่ข้อสอบ');
 r.forEach((x,n)=>{const e=m=>{throw new Error('ข้อที่ '+(n+1)+': '+m)};
  if(!Array.isArray(x)||x.length<3)e('ต้องเป็น ["โจทย์", ["ตัวเลือก",...], ข้อที่ถูก]');
  if(typeof x[0]!='string'||!x[0].trim())e('โจทย์ว่าง');
  if(!Array.isArray(x[1])||x[1].length<2||x[1].length>5||x[1].some(o=>typeof o!='string'||!o.trim()))e('ตัวเลือกต้องมี 2–5 ข้อ และเป็นข้อความ');
  if(!Number.isInteger(x[2])||x[2]<0||x[2]>=x[1].length)e('ข้อที่ถูกต้องเป็นเลข 0–'+(x[1].length-1)+' (0=ก 1=ข 2=ค 3=ง 4=จ)')});
 return r.map(x=>[x[0],x[1],x[2]])}
function aqPieces(mode,meta,rows){return aqSet(mode=='new'?{name:meta.name,icon:meta.icon,color:meta.color,q:rows}:{to:meta.to,q:rows})}
function aqBuild(t,mode,meta,rows){
 if(!/window\.EXTRA\s*=\s*\[/.test(t))throw new Error('ไม่พบ window.EXTRA ในไฟล์');
 const m=t.match(/\]\s*;\s*$/);
 if(!m)throw new Error('ท้ายไฟล์ไม่ตรงโครงสร้างที่คาดไว้ (ต้องจบด้วย ];)');
 const head=t.slice(0,m.index).trimEnd().replace(/,$/,'');
 return head+(/\[$/.test(head)?'\n':',\n')+aqPieces(mode,meta,rows)+'\n];\n'}
async function aqFallback(mode,meta,rows,why){
 const snip=',\n'+aqPieces(mode,meta,rows);
 const how='เปิด <b>exam-data.js</b> → วางต่อท้าย <b>}</b> ของชุดสุดท้าย ก่อน <b>];</b> ท้ายไฟล์';
 const r=await Swal.fire({icon:'info',title:'คัดลอกไปวางในไฟล์เอง',width:640,showCancelButton:true,confirmButtonText:'📋 คัดลอก',cancelButtonText:'ปิด',
  html:'<div style="text-align:left;font-size:.9rem">'+(why?'<div style="color:var(--no);margin-bottom:6px">'+why+'</div>':'')+'เบราว์เซอร์นี้เขียนไฟล์ตรงๆ ไม่ได้ (ใช้ Chrome/Edge บนคอมจะบันทึกอัตโนมัติ)<br>'+how+'<textarea id="aq-o" class="aqi" readonly style="margin-top:8px">'+snip.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea></div>'});
 if(r.isConfirmed){try{await navigator.clipboard.writeText(snip);toast('คัดลอกแล้ว 📋')}catch(e){const a=document.getElementById('aq-o');al('คัดลอกเอง','แตะในกล่องข้อความ เลือกทั้งหมด แล้วคัดลอก','info')}}}

function aqExtraText(arr){return 'window.EXTRA=[\n'+arr.map(aqSet).join(',\n')+(arr.length?'\n':'')+'];\n'}
// ลบชุด k: ลบรายการที่สร้างชุดนั้น + รายการที่เพิ่มเข้าชุดนั้น และเลื่อนเลขชุดที่อยู่หลังขึ้น 1
function aqDrop(cur,k,nb,name){
 let n=-1,p=-1;cur.forEach((b,i)=>{if(b.to==null){n++;if(n==k-nb)p=i}});
 if(p<0||cur[p].name!==name)throw new Error('ไม่พบชุดนี้ในไฟล์ (ไฟล์อาจไม่ตรงกับที่โหลดอยู่ ลองรีเฟรชแล้วทำใหม่)');
 return cur.filter((b,i)=>i!=p&&b.to!==k).map(b=>b.to!=null&&b.to>k?Object.assign({},b,{to:b.to-1}):b)}
function aqRemove(t,k,nb,name){
 const m=t.match(/window\.EXTRA\s*=\s*\[/);if(!m)throw new Error('ไม่พบ window.EXTRA ในไฟล์');
 let cur;try{cur=new Function('window',t+'\n;return window.EXTRA')({})}catch(x){throw new Error('อ่าน exam-data.js ไม่ได้: '+x.message)}
 if(!Array.isArray(cur))throw new Error('อ่าน window.EXTRA ไม่ได้');
 let out=t.slice(0,m.index)+aqExtraText(aqDrop(cur,k,nb,name));
 const mm=metaGet(out);if(Object.keys(mm.names).length||mm.order.length)out=metaSet(out,metaDrop(mm,k));
 return out}

 sv('ktm',[...M].map(f).filter(j=>j>=0));sv('ktbk',[...BK].map(f).filter(j=>j>=0));sv('ktcs',[...cs].map(g).filter(j=>j>=0))}

const GH={repo:'ZEROXGCK/assistanttest',path:'exam-data.js',br:'main'};
const GHNOTE='คอมมิตลง exam-data.js ใน GitHub แล้ว · ถ้าเปิดผ่าน GitHub Pages ให้รอประมาณ 1–2 นาทีแล้วรีเฟรชหน้า จึงจะเห็นผลบนทุกเครื่อง';
const ghH=(tk,a)=>({'Authorization':'Bearer '+tk,'Accept':a||'application/vnd.github+json'});
async function ghReq(tk,url,opt){const r=await fetch(url,Object.assign({headers:ghH(tk),cache:'no-store'},opt));if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const e=new Error('GitHub '+r.status+(m?' · '+m:''));e.status=r.status;throw e}return r.json()}
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)};
async function ghSave(fn,msg){const tk=ld('ktgh','');if(!tk)throw new Error('ยังไม่ได้เชื่อม GitHub');
 const url='https://api.github.com/repos/'+GH.repo+'/contents/'+GH.path;
 const j=await ghReq(tk,url+'?ref='+GH.br);let text;
 if(j.content&&j.encoding=='base64')text=b64d(j.content);
 else{const r=await fetch(url+'?ref='+GH.br,{headers:ghH(tk,'application/vnd.github.raw+json'),cache:'no-store'});if(!r.ok)throw new Error('GitHub '+r.status);text=await r.text()}
 const n=fn(text);new Function(n);
 await ghReq(tk,url,{method:'PUT',headers:Object.assign(ghH(tk),{'Content-Type':'application/json'}),body:JSON.stringify({message:msg,content:b64e(n),sha:j.sha,branch:GH.br})});
 return n}
// META = ชื่อที่แก้ + ลำดับการแสดง เก็บเป็นบรรทัดเดียวใน exam-data.js (อยู่เหนือ window.EXTRA)
function metaGet(t){const a=[...t.matchAll(/^window\.META=(.*);\/\/META[ \t]*\r?$/gm)];const d={names:{},order:[]};if(!a.length)return d;try{return Object.assign(d,JSON.parse(a[a.length-1][1]))}catch(e){return d}}
function metaSet(t,meta){const line='window.META='+JSON.stringify({names:meta.names||{},order:meta.order||[]})+';//META\n';
 t=t.replace(/^window\.META=.*;\/\/META[ \t]*\r?$\n?/gm,'');
 const m=t.match(/window\.EXTRA\s*=\s*\[/);if(!m)throw new Error('ไม่พบ window.EXTRA ในไฟล์');
 return t.slice(0,m.index)+line+t.slice(m.index)}
function metaDrop(meta,k){const names={};Object.keys(meta.names||{}).forEach(x=>{x=+x;if(x==k)return;names[x>k?x-1:x]=meta.names[x]});
 return{names,order:(meta.order||[]).filter(x=>x!=k).map(x=>x>k?x-1:x)}}
